<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Route-specific title / description / canonical / OG / Twitter tags and JSON-LD
      are injected at build time by prerender (from src/data/seo.ts and
      src/data/structuredData.ts) and updated on client navigation by SeoHead /
      StructuredData. A homepage title remains here as a safe fallback for local dev.
    -->
    <title>Pearls Opticians | Professional Eye Care in Harare, Zimbabwe</title>
    <meta
      name="description"
      content="Discover professional eye care and quality eyewear at Pearls Opticians in Harare, Zimbabwe. Explore our services, eyewear collection and branches."
    />
    <meta name="theme-color" content="#262694" />
    <link rel="canonical" href="https://pearlsopticians.co.zw/" />

    <!-- Favicons & app icons -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph / social fallbacks (route-specific tags injected at prerender) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pearls Opticians" />
    <meta property="og:title" content="Pearls Opticians | Professional Eye Care in Harare, Zimbabwe" />
    <meta
      property="og:description"
      content="Discover professional eye care and quality eyewear at Pearls Opticians in Harare, Zimbabwe. Explore our services, eyewear collection and branches."
    />
    <meta property="og:url" content="https://pearlsopticians.co.zw/" />
    <meta property="og:image" content="https://pearlsopticians.co.zw/images/og-default.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Pearls Opticians — Eye Care & Eye Wear" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pearls Opticians | Professional Eye Care in Harare, Zimbabwe" />
    <meta
      name="twitter:description"
      content="Discover professional eye care and quality eyewear at Pearls Opticians in Harare, Zimbabwe. Explore our services, eyewear collection and branches."
    />
    <meta name="twitter:image" content="https://pearlsopticians.co.zw/images/og-default.jpg" />

    <!-- Fonts: avoid CSS @import (render-blocking chain). display=swap already set by Google. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Playfair+Display:wght@400;500;600;700&display=swap"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
